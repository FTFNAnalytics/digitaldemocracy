name: Production asset smoke

# On-demand check that the live homepage and every /_next/static asset it
# references return HTTP 200. No secrets, no SSH, no deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run smoke -- https://center4digitaldemocracy.com
